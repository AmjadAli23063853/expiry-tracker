<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Expiry Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { font-size: 28px; font-weight: 800; color: #1a1a2e; }
    .logo p { font-size: 14px; color: #718096; margin-top: 4px; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    .btn { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: #5a6fd6; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 1rem; font-size: 13px; background: #fff5f5; color: #742a2a; border: 1px solid #feb2b2; }
    .hint { background: #f7fafc; border-radius: 8px; padding: 12px; margin-top: 1.5rem; font-size: 13px; color: #4a5568; }
    .hint strong { color: #1a1a2e; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>ExpiryTracker</h1>
    <p>Please log in to continue</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>
  <div class="hint">
    <strong>Demo credentials:</strong><br>
    Username: <strong>admin</strong> | Password: <strong>admin123</strong><br>
    Username: <strong>manager</strong> | Password: <strong>manager123</strong>
  </div>
</div>
</body>
</html>
